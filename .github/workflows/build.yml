name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Stable signing key from the repository secrets (optional): without it the APK is signed
      # with a throwaway debug key and cannot install over a previous build.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/netrunner.jks"
            echo "NETRUNNER_KEYSTORE=$RUNNER_TEMP/netrunner.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret: debug signing"
          fi
      - name: Build release APK
        env:
          NETRUNNER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      # Shows which key signed the APK in the run summary ("Android Debug" = throwaway key).
      - name: Signer
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          OWNER=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | grep -m1 "certificate DN" | sed 's/^[^:]*: //')
          echo "::notice title=Signature::${OWNER:-unknown}"
      - uses: actions/upload-artifact@v4
        with:
          name: netrunner-launcher
          path: app/build/outputs/apk/release/*.apk
      # Publishes a GitHub release for each new version on main; the in-app updater reads it.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already released"
            exit 0
          fi
          cp app/build/outputs/apk/release/*.apk "netrunner-$VERSION.apk"
          gh release create "v$VERSION" "netrunner-$VERSION.apk" \
            --title "Netrunner v$VERSION" --latest \
            --notes "$(git log -1 --pretty=%B | head -n 1)"
