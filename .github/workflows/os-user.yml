name: Build Netrunner OS (User)

on:
  push:
    branches: [main]
    paths: ["os/**", "os-apps/**", "os-bridge/**", "desktop/src/main/resources/agent/**", "desktop/src/main/resources/font/**", ".github/workflows/os-user.yml"]
  pull_request:
    paths: ["os/**", "os-apps/**", "os-bridge/**", "desktop/src/main/resources/agent/**", "desktop/src/main/resources/font/**", ".github/workflows/os-user.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The Linux inventory agent, as the package the image carries.
  deck-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          shellcheck os/apps/build-deb.sh os/deck-probe/build-deb.sh os/deck-probe/deck-probe-inscrire os/deck-probe/inscrire-root \
            os/user/build.sh os/user/config/hooks/normal/*.hook.chroot os/user/config/includes.chroot/usr/bin/* \
            desktop/src/main/resources/agent/*.sh
          python3 desktop/src/main/resources/agent/deck-probe.py --print | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["hostname"] and r["ramGB"] > 0 and r["software"], r'
      - name: Package
        run: sh os/deck-probe/build-deb.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: deck-probe-deb
          path: dist/*.deb

  # Netrunner OS's own apps (os-apps): tests, the jar, then its package.
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew --no-daemon -p os-apps test
      - name: Jar
        run: ./gradlew --no-daemon -p os-apps packageUberJarForCurrentOS
      # Web's Chromium engine, fetched once here and shipped in the package.
      - name: Web engine
        run: |
          java -jar os-apps/build/compose/jars/*.jar web --installer "$RUNNER_TEMP/jcef"
          test -f "$RUNNER_TEMP/jcef/install.lock"
          mkdir -p ~/.local/share/netrunner && ln -sfn "$RUNNER_TEMP/jcef" ~/.local/share/netrunner/jcef
          du -sh "$RUNNER_TEMP/jcef"
      # Each app must stay up on a (virtual) screen, without an exception.
      - name: Launch check
        run: |
          sudo apt-get install -y xvfb libvlc5 vlc-plugin-base >/dev/null
          JAR=$(ls os-apps/build/compose/jars/*.jar)
          mkdir -p "$RUNNER_TEMP/media" && cp os/apps/netrunner-photos.svg "$RUNNER_TEMP/media/"
          for app in photos video pdf texte tableur presentation web; do
            set +e
            SKIKO_RENDER_API=SOFTWARE timeout 30 xvfb-run -a java -jar "$JAR" "$app" "$RUNNER_TEMP/media" > "launch-$app.log" 2>&1
            code=$?
            set -e
            cat "launch-$app.log"
            if [ $code -ne 124 ] || grep -qE "Exception in thread|Error was captured" "launch-$app.log"; then echo "$app stopped at launch ($code)"; exit 1; fi
          done
      - name: Package
        run: JCEF_DIR="$RUNNER_TEMP/jcef" sh os/apps/build-deb.sh os-apps/build/compose/jars/*.jar dist
      - uses: actions/upload-artifact@v4
        with:
          name: netrunner-apps-deb
          path: dist/*.deb

  iso:
    needs: [deck-probe, apps]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # live-build needs about 15 GB: drop the runner's SDKs it does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: deck-probe-deb
          path: pkgs
      - uses: actions/download-artifact@v4
        with:
          name: netrunner-apps-deb
          path: pkgs
      # As//ka, in option on the image: the newest askapc-v… release, if there is one.
      - name: As//ka package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("askapc-v"))][0].tagName')
          if [ -n "$TAG" ] && gh release download "$TAG" --pattern 'aska-*.deb' --dir aska; then
            mkdir -p extras && mv aska/*.deb extras/aska.deb
            echo "As//ka $TAG"
          else
            echo "::warning::pas de release As//ka : image sans As//ka"
          fi
      - name: Build
        run: |
          ASKA=; [ -f extras/aska.deb ] && ASKA=/src/extras/aska.deb
          docker run --rm --privileged -e ASKA_DEB="$ASKA" -v "$PWD:/src" debian:trixie \
            sh -c '/src/os/user/build.sh /src/out /src/pkgs/*.deb' 
          sudo chown -R "$(id -u)" out
      - uses: actions/upload-artifact@v4
        with:
          name: netrunner-os-user
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netrunner-os-user-build-log
          path: out/build.log

      # Tagged "os-user-v…" and never marked latest (the launcher's updater reads the latest release).
      # GitHub takes files up to 2 GiB: a bigger ISO goes up in parts, joined back with cat.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat os/user/VERSION)
          if gh release view "os-user-v$VERSION" >/dev/null 2>&1; then
            echo "os-user-v$VERSION already released"
            exit 0
          fi
          cd out
          ISO="netrunner-os-user-$VERSION-amd64.iso"
          FILES="$ISO.sha256"
          if [ "$(stat -c %s "$ISO")" -gt 2000000000 ]; then
            split -b 1900M -d "$ISO" "$ISO.part"
            FILES="$FILES $(ls "$ISO".part*)"
            NOTE="ISO en plusieurs morceaux : cat $ISO.part* > $ISO, puis sha256sum -c $ISO.sha256"
          else
            FILES="$FILES $ISO"
            NOTE=""
          fi
          # shellcheck disable=SC2086
          gh release create "os-user-v$VERSION" $FILES \
            --title "Netrunner OS User v$VERSION" --latest=false \
            --notes "$(git log -1 --pretty=%B | head -n 1)

          $NOTE"
