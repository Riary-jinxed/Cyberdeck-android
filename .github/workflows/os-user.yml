name: Build Netrunner OS (User)

on:
  push:
    branches: [main]
    paths: ["os/**", "desktop/src/main/resources/agent/**", ".github/workflows/os-user.yml"]
  pull_request:
    paths: ["os/**", "desktop/src/main/resources/agent/**", ".github/workflows/os-user.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The Linux inventory agent, as the package the image carries.
  deck-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          shellcheck os/deck-probe/build-deb.sh os/deck-probe/deck-probe-inscrire os/deck-probe/inscrire-root \
            os/user/build.sh os/user/config/hooks/normal/*.hook.chroot os/user/config/includes.chroot/usr/bin/* \
            desktop/src/main/resources/agent/*.sh
          python3 desktop/src/main/resources/agent/deck-probe.py --print | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["hostname"] and r["ramGB"] > 0 and r["software"], r'
      - name: Package
        run: sh os/deck-probe/build-deb.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: deck-probe-deb
          path: dist/*.deb

  iso:
    needs: deck-probe
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # live-build needs about 15 GB: drop the runner's SDKs it does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: deck-probe-deb
          path: pkgs
      # As//ka, in option on the image: the newest askapc-v… release, if there is one.
      - name: As//ka package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("askapc-v"))][0].tagName')
          if [ -n "$TAG" ] && gh release download "$TAG" --pattern 'aska-*.deb' --dir aska; then
            mv aska/*.deb pkgs/aska.deb
            echo "As//ka $TAG"
          else
            echo "::warning::pas de release As//ka : image sans As//ka"
          fi
      - name: Build
        run: |
          ASKA=; [ -f pkgs/aska.deb ] && ASKA=/src/pkgs/aska.deb
          docker run --rm --privileged -v "$PWD:/src" debian:trixie \
            sh -c "/src/os/user/build.sh /src/out /src/pkgs/deck-probe_*_all.deb $ASKA"
          sudo chown -R "$(id -u)" out
      - uses: actions/upload-artifact@v4
        with:
          name: netrunner-os-user
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netrunner-os-user-build-log
          path: out/build.log

      # Tagged "os-user-v…" and never marked latest (the launcher's updater reads the latest release).
      # GitHub takes files up to 2 GiB: a bigger ISO goes up in parts, joined back with cat.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat os/user/VERSION)
          if gh release view "os-user-v$VERSION" >/dev/null 2>&1; then
            echo "os-user-v$VERSION already released"
            exit 0
          fi
          cd out
          ISO="netrunner-os-user-$VERSION-amd64.iso"
          FILES="$ISO.sha256"
          if [ "$(stat -c %s "$ISO")" -gt 2000000000 ]; then
            split -b 1900M -d "$ISO" "$ISO.part"
            FILES="$FILES $(ls "$ISO".part*)"
            NOTE="ISO en plusieurs morceaux : cat $ISO.part* > $ISO, puis sha256sum -c $ISO.sha256"
          else
            FILES="$FILES $ISO"
            NOTE=""
          fi
          # shellcheck disable=SC2086
          gh release create "os-user-v$VERSION" $FILES \
            --title "Netrunner OS User v$VERSION" --latest=false \
            --notes "$(git log -1 --pretty=%B | head -n 1)

          $NOTE"
