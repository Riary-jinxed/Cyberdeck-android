name: Build Deck Link (PC)

on:
  push:
    branches: [main]
    paths: ["desktop/**", "sync-core/**", ".github/workflows/decklink.yml"]
  pull_request:
    paths: ["desktop/**", "sync-core/**", ".github/workflows/decklink.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Sync protocol tests (shared with the launcher) and the Windows installer / Linux package.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            out: desktop/build/compose/binaries/main/msi/*.msi
            name: deck-link-windows
          - os: ubuntu-latest
            task: packageDeb
            out: desktop/build/compose/binaries/main/deb/*.deb
            name: deck-link-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew --no-daemon -p desktop test
      - name: Package
        run: ./gradlew --no-daemon -p desktop ${{ matrix.task }}
      # The packaged app must stay up: a missing library or module only shows once it runs.
      # (Skiko falling back from OpenGL under Xvfb logs a RenderException: harmless.)
      - name: Launch check (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb >/dev/null
          dpkg-deb -x desktop/build/compose/binaries/main/deb/*.deb "$RUNNER_TEMP/deb"
          set +e
          DECKLINK_HOME="$RUNNER_TEMP/home" timeout 30 xvfb-run -a "$RUNNER_TEMP/deb/opt/deck-link/bin/Deck Link" > launch.log 2>&1
          code=$?
          cat launch.log
          if [ $code -ne 124 ] || grep -qE "Exception in thread|Error was captured" launch.log; then echo "Deck Link stopped at launch ($code)"; exit 1; fi
      - name: Agent report (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $json = powershell -NoProfile -ExecutionPolicy Bypass -File desktop/src/main/resources/agent/deck-probe.ps1 -Print
          $json
          $r = $json | ConvertFrom-Json
          if (-not $r.hostname -or -not $r.cpu -or $r.ramGB -le 0) { throw "incomplete report" }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.out }}

  # Tagged "decklink-v…" and never marked latest: the launcher's updater reads the latest
  # release, and its deck-app list skips releases without an APK.
  release:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'val appVersion = "\K[^"]+' desktop/build.gradle.kts)
          if gh release view "decklink-v$VERSION" >/dev/null 2>&1; then
            echo "decklink-v$VERSION already released"
            exit 0
          fi
          cp dist/deck-link-windows/*.msi "deck-link-$VERSION.msi"
          cp dist/deck-link-linux/*.deb "deck-link-$VERSION.deb"
          gh release create "decklink-v$VERSION" "deck-link-$VERSION.msi" "deck-link-$VERSION.deb" \
            --title "Deck Link (PC) v$VERSION" --latest=false \
            --notes "$(git log -1 --pretty=%B | head -n 1)"
