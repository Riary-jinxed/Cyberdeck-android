name: Build Calcul APK

on:
  push:
    branches: [main]
    paths: ["calc/**", "deck/**", "settings.gradle.kts", "build.gradle.kts", ".github/workflows/calc.yml"]
  pull_request:
    paths: ["calc/**", "deck/**", "settings.gradle.kts", "build.gradle.kts", ".github/workflows/calc.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Same signing key as the launcher (repository secrets); debug key without them.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/netrunner.jks"
            echo "NETRUNNER_KEYSTORE=$RUNNER_TEMP/netrunner.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret: debug signing"
          fi
      - name: Build release APK
        env:
          NETRUNNER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :calc:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: netrunner-calcul
          path: calc/build/outputs/apk/release/*.apk
      # Tagged "calc-v…" and never marked latest: the launcher's updater reads the latest
      # release, and must only ever see launcher APKs there.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' calc/build.gradle.kts)
          if gh release view "calc-v$VERSION" >/dev/null 2>&1; then
            echo "calc-v$VERSION already released"
            exit 0
          fi
          cp calc/build/outputs/apk/release/*.apk "calc-$VERSION.apk"
          gh release create "calc-v$VERSION" "calc-$VERSION.apk" \
            --title "Calcul Netrunner v$VERSION" --latest=false \
            --notes "$(git log -1 --pretty=%B | head -n 1)"
